# Fly.io config for the SEO Writer web app.
# Change `app` to a globally-unique name and `primary_region` to one near you
# (run `flyctl platform regions` to list them). See README-DEPLOY.md.

app = "seo-writer-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine up. A pipeline run started by an automation platform has
  # no browser holding a connection open, and Fly's idle detection would stop
  # the machine mid-job - taking the callback with it. (~$2-4/mo for the
  # difference; set back to 0 if you only ever start runs from the browser.)
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  # 1 worker holds the in-memory job store, so keep a single machine.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

# Persist generated articles across deploys/restarts.
[[mounts]]
  source = "seo_data"
  destination = "/app/output"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
