<!DOCTYPE html>
<html lang="en">
<head>
{% include "_head.html" %}
<title>Sign in — Humanly</title>
<style>
{% include "_theme.css" %}

  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { width: 100%; max-width: 400px; padding: 40px 36px 30px; box-shadow: var(--shadow-2); }
  .wordmark { font-family: var(--serif); font-size: 44px; font-weight: 400; letter-spacing: -.03em; line-height: 1; font-variation-settings: "opsz" 144; }
  .wordmark i { color: var(--accent); font-weight: 350; }
  .sub { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--muted); margin: 8px 0 28px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .error { display: flex; gap: 8px; background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); color: var(--bad);
           font-size: 13.5px; font-weight: 500; padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 16px; }
  .gap { margin-top: 14px; }
  .btn.block { margin-top: 18px; }
  .foot { font-family: var(--serif); font-style: italic; font-size: 13.5px; color: var(--muted); margin-top: 24px; text-align: center; line-height: 1.55; }
</style>
</head>
<body>

<form class="box card" method="post" action="/login">
  <div class="wordmark">Human<i>ly</i></div>
  <div class="sub">A writing studio. Sign in to your workspace.</div>

  {% if error %}
    <div class="error" role="alert"><span>✕</span>{{ error }}</div>
  {% endif %}

  <input type="hidden" name="next" value="{{ next }}">

  <label for="username">Username or email</label>
  <input type="text" id="username" name="username" autocomplete="username" value="{{ username or '' }}"
         placeholder="Leave empty for the studio owner" autofocus>

  <div class="gap">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
  </div>

  <button type="submit" class="btn btn-primary block">Sign in</button>

  <div class="foot">
    Generating an article spends API credits.<br>This page is why it isn't open to everyone.<br>
    <a href="/trust" style="font-style:normal;font-size:12.5px">How client data is handled</a>
  </div>
</form>

</body>
</html>
