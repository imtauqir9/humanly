<!DOCTYPE html>
<html lang="en">
<head>
{% include "_head.html" %}
<title>Sign in — Humanly</title>
<style>
{% include "_theme.css" %}

  body { display: flex; align-items: center; justify-content: center; padding: 24px;
         background: radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), var(--bg); }
  .box { width: 100%; max-width: 380px; padding: 34px 30px 28px; box-shadow: var(--shadow-2); }
  .brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .brand-mark { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; font-size: 19px; color: #fff;
                background: linear-gradient(135deg, #6d8bff, #3b5bdb 55%, #7c4dff); box-shadow: 0 4px 16px rgba(91,120,255,.35); }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .error { display: flex; gap: 8px; background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); color: var(--bad);
           font-size: 13px; font-weight: 500; padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 16px; }
  .btn.block { margin-top: 16px; }
  .foot { font-size: 12px; color: var(--faint); margin-top: 22px; text-align: center; line-height: 1.55; }
</style>
</head>
<body>

<form class="box card" method="post" action="/login">
  <div class="brand-row">
    <span class="brand-mark">H</span>
    <div>
      <h1>Humanly</h1>
      <div class="sub">Imran Tauqir's AI writing pipeline</div>
    </div>
  </div>

  {% if error %}
    <div class="error" role="alert">{{ error }}</div>
  {% endif %}

  <input type="hidden" name="next" value="{{ next }}">

  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password"
         autofocus required>

  <button type="submit" class="btn btn-primary block">Sign in</button>

  <div class="foot">
    Generating an article spends API credits.<br>This page is why it isn't open to everyone.
  </div>
</form>

</body>
</html>
