<!DOCTYPE html>
<html lang="en">
<head>
{% include "_head.html" %}
<title>No workspace yet — Humanly</title>
<style>
{% include "_theme.css" %}
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { max-width: 440px; padding: 36px; text-align: center; }
  h1 { font-family: var(--serif); font-weight: 350; font-size: 32px; letter-spacing: -.02em; margin-bottom: 10px; }
  p { color: var(--ink-2); margin-bottom: 20px; }
</style>

<body>
  <div class="box card">
    <h1>No workspace yet</h1>

    <a class="btn btn-ghost" href="/logout">Sign out</a>
  </div>
