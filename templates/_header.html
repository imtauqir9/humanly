<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/"><span class="brand-mark">H</span><span class="brand-name">Humanly</span></a>
    {% if crumb %}<span class="crumb">{{ crumb }}</span>{% endif %}
    <nav>
      <a href="/"{% if active == 'write' %} class="active"{% endif %}>Write</a>
      <a href="/library"{% if active == 'library' %} class="active"{% endif %}>Library</a>
      <a href="/usage"{% if active == 'usage' %} class="active"{% endif %}>Usage</a>
      <span class="sep"></span>
      <button type="button" class="theme-toggle" id="themeToggle" title="Switch light / dark" aria-label="Switch light or dark theme">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a href="/logout">Sign out</a>
    </nav>
  </div>
</header>
<script>
  document.getElementById('themeToggle').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('humanly-theme', root.dataset.theme); } catch (e) {}
  });
</script>
